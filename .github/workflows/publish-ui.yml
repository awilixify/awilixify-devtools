---
name: Publish DevTools UI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example, 0.1.0)"
        required: true
        default: "0.1.0"
        type: string

concurrency:
  group: publish-devtools-ui
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_NAME: ghcr.io/wildstyles/awilixify-devtools-ui
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Prepare version
        id: version
        working-directory: devtools-ui
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION"
            exit 1
          fi

          if git rev-parse "ui-v$VERSION" >/dev/null 2>&1; then
            echo "Tag ui-v$VERSION already exists"
            exit 1
          fi

          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=ui-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and tag release
        id: release
        env:
          VERSION: ${{ steps.version.outputs.value }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add devtools-ui/package.json

          if ! git diff --cached --quiet; then
            git commit -m "chore(ui): release v$VERSION"
          fi

          git tag "$RELEASE_TAG"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "$RELEASE_TAG"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ./devtools-ui
          file: ./devtools-ui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            IMAGE_REVISION=${{ steps.release.outputs.revision }}
            IMAGE_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
