server {
	listen 3222;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	location = /healthz {
		access_log off;
		add_header Content-Type text/plain;
		return 200 "ok\n";
	}

	include /etc/nginx/devtools-targets.locations;

	location /__devtools/ {
		return 404;
	}

	location /assets/ {
		try_files $uri =404;
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
